name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to release, for example v1.0.8"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Restore fixed Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing fixed signing secrets: ' + ', '.join(missing))
          key = Path('android/keystore/release.jks')
          key.parent.mkdir(parents=True, exist_ok=True)
          key.write_bytes(base64.b64decode(os.environ[names[0]], validate=True))
          key.chmod(0o600)
          def prop(value):
              return ''.join('\\u%04x' % ord(c) for c in value)
          values = {'storeFile': 'keystore/release.jks', 'storePassword': os.environ[names[1]],
                    'keyAlias': os.environ[names[2]], 'keyPassword': os.environ[names[3]]}
          config = Path('android/key.properties')
          config.write_text(''.join(k + '=' + prop(v) + '\n' for k, v in values.items()), encoding='ascii')
          config.chmod(0o600)
          PY

      - name: Build release APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --no-tree-shake-icons 2>&1 | tee build-release.log; then
            {
              echo "### Build release APK failed"
              echo '```text'
              tail -n 120 build-release.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            message="$(tail -n 40 build-release.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=Build release APK failed::$message"
            exit 1
          fi

      - name: Prepare release asset
        id: asset
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          mkdir -p release
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          APK_NAME="daily-ootd-${TAG_NAME}-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release/${APK_NAME}"
          echo "apk_path=release/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          APK_PATH: ${{ steps.asset.outputs.apk_path }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$APK_PATH" --title "$TAG_NAME" --generate-notes
          fi

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/keystore/release.jks
